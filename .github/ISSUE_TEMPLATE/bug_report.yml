name: Bug report
description: Report app behaviour without sharing private trip data.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Do not attach real coordinates, access tokens, faces, licence plates, or home addresses.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android, iOS]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Device, OS, and app version
      placeholder: Pixel 9 / Android 16 / RoadLimit 0.1.0
    validations:
      required: true
  - type: dropdown
    id: app_state
    attributes:
      label: App state
      options: [Foreground, Background, Screen locked, After force-stop, Unknown]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Redacted reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
